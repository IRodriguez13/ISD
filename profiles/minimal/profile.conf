# Canonical interactive minimum — see Documentation/MINIMAL_PROFILE.md
# First boot: interactive account wizard; wheel user uses admin tool (see ADMIN_ELEVATION).
# Package `sudo` must appear in packages.txt — resolve-packages does not pull an elevation
# package from ADMIN_ELEVATION alone (minimal stays core-only unless listed).
ADMIN_ELEVATION=sudo
# Package truth: profiles/minimal/packages.txt (+ optional .isdconfig extras).
# INSTALL_* below are legacy fallbacks only; prefer packages.txt.
PROFILE_NAME=minimal
USERLAND_BASE=busybox
INIT_SYSTEM=runit
LOGIN_POLICY=firstboot
ROOT_POLICY=locked
ROOT_AUTOLOGIN=0
NETWORK_MODE=none
INSTALL_SMOKE=0
FSCK_ON_BOOT=0
ROOT_FS=minix
ROOTFS_PACK=minix
