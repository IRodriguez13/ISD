# Same userspace as desktop (X stack, ext2 /home) but no auto-startx on login.
# Package truth: profiles/desktop-console/packages.txt → desktop packages.txt
PROFILE_NAME=desktop-console
USERLAND_BASE=busybox
INIT_SYSTEM=runit
KMANG_BOOT_PROMPT=1
LOGIN_POLICY=firstboot
ROOT_POLICY=noroot_login
ROOT_AUTOLOGIN=0
NETWORK_MODE=none
INSTALL_SMOKE=0
FSCK_ON_BOOT=1
REQUIRES_HOME_DISK=1
ROOTFS_PACK=minix
ROOT_FS=minix
