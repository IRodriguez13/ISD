# Parallel minimal profile — OpenRC (openrc-init PID 1).
# First boot: interactive account wizard; wheel user uses admin tool (see ADMIN_ELEVATION).
ADMIN_ELEVATION=doas
PROFILE_NAME=minimal-openrc
USERLAND_BASE=busybox
INIT_SYSTEM=openrc
LOGIN_POLICY=firstboot
ROOT_POLICY=locked
ROOT_AUTOLOGIN=0
NETWORK_MODE=none
INSTALL_SMOKE=0
FSCK_ON_BOOT=0
ROOTFS_PACK=minix
ROOT_FS=minix
