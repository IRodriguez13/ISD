# Parallel minimal profile — sysvinit PID 1 instead of runit.
# First boot: interactive account wizard; wheel user uses admin tool (see ADMIN_ELEVATION).
ADMIN_ELEVATION=doas
PROFILE_NAME=minimal-sysvinit
USERLAND_BASE=busybox
INIT_SYSTEM=sysvinit
LOGIN_POLICY=firstboot
ROOT_POLICY=locked
ROOT_AUTOLOGIN=0
NETWORK_MODE=none
INSTALL_SMOKE=0
FSCK_ON_BOOT=0
ROOTFS_PACK=minix
ROOT_FS=minix
