# x86_64 toolchain facts. Read only through scripts/arch-policy.sh.
ISD_ARCH_TRIPLE=x86_64-linux-musl
# readelf -h "Machine:" values accepted by elf-audit (ERE alternatives).
ISD_ARCH_ELF_MACHINE='Advanced Micro Devices X86-64|X86-64|EM_X86_64'
# Goal name IR0's Makefile uses for this ISA (make headers_install <goal>).
ISD_ARCH_IR0_GOAL=x86-64
