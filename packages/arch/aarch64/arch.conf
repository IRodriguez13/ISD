# AArch64 toolchain facts. Read only through scripts/arch-policy.sh.
ISD_ARCH_TRIPLE=aarch64-linux-musl
# readelf -h "Machine:" values accepted by elf-audit (ERE alternatives).
ISD_ARCH_ELF_MACHINE='AArch64|ARM aarch64|EM_AARCH64'
# Goal name IR0's Makefile uses for this ISA (make headers_install <goal>).
ISD_ARCH_IR0_GOAL=arm64
